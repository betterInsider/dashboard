<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Better Inside Dashboard{% endblock %}</title>
    <script>
        (function () {
            try {
                var savedTheme = localStorage.getItem('theme');
                var root = document.documentElement;
                if (savedTheme === 'dark') {
                    root.classList.add('dark-theme');
                } else {
                    root.classList.add('light-theme');
                }
            } catch (e) {
                document.documentElement.classList.add('light-theme');
            }
        })();
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- html2pdf for contract generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/main.css">
    
    <script>
        window.CSRF_TOKEN = "{{ csrf_token }}";
        window.BETTER_INSIDE_CONFIG = {
            jaasAppId: "{{ JAAS_APP_ID|default:'vpaas-magic-cookie-148ee617d13a4f6b96bd2e6ce8c7e647'|escapejs }}"
        };
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Mobile Blocker Overlay -->
    <div class="mobile-blocker">
        <h1 style="font-size: 70px; margin-bottom: 20px;">💻</h1>
        <h2 style="color: var(--text-primary); margin-bottom: 15px; font-size: 24px; font-weight: 700;">Desktop Required</h2>
        <p style="color: var(--text-secondary); font-size: 16px;">This site will run on your computer only.</p>
        <p style="color: var(--primary); font-size: 18px; font-weight: 700; margin-top: 20px;">So stop being lazy and open your computer! 😜🤣</p>
    </div>

    {% block content %}{% endblock %}

    <!-- Scripts -->
    <script src="/static/js/data.js" type="module"></script>
    <script src="/static/js/components.js" type="module"></script>
    <script src="/static/js/app.js" type="module"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
