{% extends "base.html" %}

{% block title %}Login | Better Inside{% endblock %}

{% block content %}
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-visual">
                <div class="glass-sphere"></div>
                <div class="glass-card-decor"></div>
                <h2>Better Inside</h2>
                <p>Premium Agency Dashboard.</p>
            </div>
            <div class="login-form-container">
                <div class="logo-wrapper">
                    <img src="/static/Logos/Logo Hrizontal Full SVG.svg" alt="Better Inside Logo">
                </div>
                <h3>Welcome Back</h3>
                <p class="subtitle">Enter your credentials to access your workspace.</p>
                <form id="login-form">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <i class='bx bx-user'></i>
                            <input type="text" id="username" name="username" required placeholder="e.g. betterinside@admin">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="password" name="password" required placeholder="Enter password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <span>Sign In</span>
                        <i class='bx bx-right-arrow-alt'></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
